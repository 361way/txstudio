name: Build release binaries

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-standalone:
    name: Verify standalone package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build and smoke-test standalone binary
        run: |
          npm run build:binary
          npm run test:standalone

  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            extension: ''
          - name: macos-amd64
            goos: darwin
            goarch: amd64
            extension: ''
          - name: windows-amd64
            goos: windows
            goarch: amd64
            extension: '.exe'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        run: npm ci

      - name: Build standalone binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: npm run build:binary

      - name: Package binary and checksum
        shell: bash
        run: |
          binary="release/txstudio${{ matrix.extension }}"
          output="release/txstudio-${{ matrix.name }}${{ matrix.extension }}"
          mv "$binary" "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: txstudio-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/txstudio-${{ matrix.name }}${{ matrix.extension }}
            release/txstudio-${{ matrix.name }}${{ matrix.extension }}.sha256

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify-standalone, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" release-assets/* --generate-notes
